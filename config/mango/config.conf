# More option see https://github.com/mangowm/mango/wiki/

# Sonokai palette (default variant): https://github.com/sainnhe/sonokai
# Used below as ${name}ff (opaque) or ${name}55 (translucent).
var=black,0x181819
var=bg_dim,0x222327
var=bg0,0x2c2e34
var=bg3,0x3b3e48
var=bg4,0x414550
var=red,0xfc5d7c
var=orange,0xf39660
var=yellow,0xe7c664
var=green,0x9ed072
var=blue,0x76cce0
var=purple,0xb39df3
var=grey,0x7f8490

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color=${black}ff

border_radius=2
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
# animation_duration_move=500
# animation_duration_open=400
# animation_duration_tag=350
# animation_duration_close=800
animation_duration_focus=0
# animation_curve_open=0.46,1.0,0.29,1
# animation_curve_move=0.46,1.0,0.29,1
# animation_curve_tag=0.46,1.0,0.29,1
# animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=150
animation_curve_open=0.2,0.8,0.2,1
animation_curve_move=0.2,0.8,0.2,1
animation_curve_tag=0.2,0.8,0.2,1
animation_curve_close=0.4,0,1,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=0
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=50
repeat_delay=400
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=${bg_dim}ff
border_color=${bg4}ff
focus_color=${blue}ff
drop_color=${blue}55
split_color=${orange}ff
maximized_screen_color=${green}ff
urgent_color=${red}ff
scratchpad_color=${purple}ff
global_color=${yellow}ff
overlay_color=${orange}ff

# Tab bar (monocle/deck tab mode)
monocle_tab_mode=0
tab_bar_height=30
tab_bar_decorate_font_desc=monospace 11
tab_bar_decorate_border_width=2
tab_bar_decorate_corner_radius=6
tab_bar_decorate_padding_x=12
tab_bar_decorate_padding_y=0
tab_bar_decorate_bg_color=${bg0}ff
tab_bar_decorate_fg_color=${grey}ff
tab_bar_decorate_focus_bg_color=${bg3}ff
tab_bar_decorate_focus_fg_color=${blue}ff
tab_bar_decorate_border_color=${bg0}ff

# Group bar (scroller stacks)
group_bar_height=30
group_bar_decorate_font_desc=monospace 11
group_bar_decorate_border_width=2
group_bar_decorate_corner_radius=6
group_bar_decorate_padding_x=12
group_bar_decorate_padding_y=0
group_bar_decorate_bg_color=${bg0}ff
group_bar_decorate_fg_color=${grey}ff
group_bar_decorate_focus_bg_color=${bg3}ff
group_bar_decorate_focus_fg_color=${blue}ff
group_bar_decorate_border_color=${bg0}ff
group_bar_button_color=${red}ff

# Jump labels (togglejump)
jump_label_decorate_bg_color=${bg0}ff
jump_label_decorate_fg_color=${yellow}ff
jump_label_decorate_focus_bg_color=${yellow}ff
jump_label_decorate_focus_fg_color=${bg0}ff
jump_label_decorate_border_color=${bg4}ff
# gap_inner_horizontal=5
# gap_inner_vertical=5
# gap_outer_horizontal=10
# gap_outer_vertical=10
# scratchpad_width_ratio=0.8
# scratchpad_height_ratio=0.9
# border_px=4
# root_color=0x201b14ff
# border_color=0x444444ff
# drop_color=0x8FBA7C55
# split_color=0xEB441EFF
# focus_color=0xc9b890ff
# maximized_screen_color=0x89aa61ff
# urgent_color=0xad401fff
# scratchpad_color=0x516c93ff
# global_color=0xb153a7ff
# overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
circle_layout=monocle,tile,grid
tag_rule=id:1,layout_name:monocle
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
# switch layout
bind=SUPER,n,switch_layout

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# tag switch: super + number
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot

# exit
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,e,quit

# switch window focus
bind=ALT,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# swap window
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,L,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER,t,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
# bind=SUPER,o,toggleoverlay,
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# External monitor is the main one, at the origin
monitor_rule=name:^HDMI-A-2$,width:1920,height:1080,refresh:100,x:0,y:0,scale:1
# Laptop panel to the right of it, for when the lid is open
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1.25
# don't scale xwayland in global to avoid blurry
xwayland_ignore_scale=1
# monitor rules
switchbind=fold,spawn,/home/brian/.config/mango/scripts/monitor.sh close
switchbind=unfold,spawn,/home/brian/.config/mango/scripts/monitor.sh open

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# brightness keys
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -n1 set 5%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# OCR
bind=SUPER+CTRL+ALT+SHIFT,1,spawn,/home/brian/.config/mango/scripts/ocr.sh

# clipboard hist
bind=SUPER+CTRL+ALT+SHIFT,C,spawn,sh -c "cliphist list | rofi -dmenu | cliphist decode | wl-copy"

# foot (and footclient, if you use foot --server) can be swallowed
window_rule=is_term:1,app_id:^foot(client)?$
# but a new terminal opened from a terminal shouldn't eat the old one
window_rule=no_swallow:1,app_id:^foot(client)?$

# lockscreen
bind=SUPER,Escape,spawn,swaylock -f -c 222327

# for typing
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# run autostart
exec_once=~/.config/mango/autostart.sh
