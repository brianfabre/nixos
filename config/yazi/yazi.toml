#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 2 ]   # set ratios 1:3:2
show_hidden    = true          # set hidden true
linemode       = "size"        # set info size
scrolloff      = 10            # set scrolloff 10
sort_sensitive = false         # set ignorecase true (sorting half)
sort_dir_first = true

[preview]
# lf needed lf_kitty_preview / lf_kitty_clean to draw images.
# Yazi talks the Kitty graphics protocol (and Sixel) natively, so
# `set sixel true` + previewer/cleaner have no equivalent — delete those scripts.
max_width  = 900
max_height = 900
